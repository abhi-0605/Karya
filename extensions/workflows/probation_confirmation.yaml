id: probation_confirmation
version: 1
trigger: timer.probation_review_due
description: "Probation confirmation workflow triggered at 90 days with HRBP reserved decision"
inputs:
  - employee_id
  - manager_rating
steps:
  - id: manager_evaluation
    skill: manager.assign_buddy
    mode: auto
    timeout_s: 15

  - id: hr_confirm_probation
    skill: hr.confirm_compensation
    action: probation.confirm
    depends_on:
      - manager_evaluation
    mode: approval
    approver_role: hrbp

  - id: update_payroll_confirmation
    skill: payroll.setup_employee
    depends_on:
      - hr_confirm_probation
    mode: auto
    timeout_s: 20

  - id: send_confirmation_letter
    skill: comms.send_welcome
    depends_on:
      - hr_confirm_probation
    mode: auto
    timeout_s: 15
